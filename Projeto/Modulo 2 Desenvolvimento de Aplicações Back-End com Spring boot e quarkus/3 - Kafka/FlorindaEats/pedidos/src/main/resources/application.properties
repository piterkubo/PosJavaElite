quarkus.datasource.db-kind=mysql
quarkus.datasource.username=root
quarkus.datasource.password=798525

# Reactive (Hibernate Reactive)
quarkus.datasource.reactive.url=mysql://localhost:3306/florindaPedido

# JDBC (Flyway usa ESTE)
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/florindaPedido

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.enabled=true
quarkus.flyway.repair-at-start=true

# Hibernate
quarkus.hibernate-orm.database.generation=validate

# HTTP
quarkus.http.port=8080

#Dev Service
quarkus.kafka.devservices.enabled=false

# Adicionando o kafka com a determinada porta
kafka.boostrap.servers=localhost:9094



